
services:
  backend:
    build:
      context: ./backend
    ports:
      - "3001:3001"
    volumes:
      - backend_data:/app/data
    environment:
      - PORT=3001
      - NODE_ENV=production
      - JWT_SECRET=your-secret-key-change-this
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
